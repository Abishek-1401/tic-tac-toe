<!DOCTYPE html>
<html>

<head>
    <title>My Awesome Game</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin-top: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            cursor: pointer;
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            background: #d4edda;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Tic-Tac-Toe</h1>

    <!-- New Scoreboard Section -->
    <div class="scoreboard">
        <div>Player X: <span id="scoreX">0</span></div>
        <div>Player O: <span id="scoreO">0</span></div>
        <div>Draws: <span id="scoreDraws">0</span></div>
    </div>

    <div class="board" id="board">
        <!-- 9 cells -->
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <script>
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let scores = { X: 0, O: 0, Draws: 0 }; // Score tracking

        function makeMove(cell, index) {
            if (board[index] === '') {
                board[index] = currentPlayer;
                cell.innerText = currentPlayer;
                checkWin();
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function checkWin() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6]           // Diagonals
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    alert(board[a] + " wins!");
                    scores[board[a]]++; // Increase score
                    updateScoreboard();
                    resetBoard();
                    return;
                }
            }

            if (!board.includes('')) {
                alert("It's a draw!");
                scores.Draws++;
                updateScoreboard();
                resetBoard();
            }
        }

        function updateScoreboard() {
            document.getElementById('scoreX').innerText = scores.X;
            document.getElementById('scoreO').innerText = scores.O;
            document.getElementById('scoreDraws').innerText = scores.Draws;
        }

        function resetBoard() {
            board = ['', '', '', '', '', '', '', '', ''];
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = '');
        }
    </script>
</body>

</html>
